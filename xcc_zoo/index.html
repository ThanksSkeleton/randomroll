<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/randomroll/favicon.svg" />
    <title>XCC Character Sheet Zoo</title>
    <link rel="stylesheet" href="/src/generators/xcc/xcc_sheet.css" />
    <style>
      .zoo-page {
        min-width: 72rem;
        margin: 0;
        padding: 1.5rem 26rem 1.5rem 1.5rem;
        background: #111;
        color: #e4e2d4;
        font-family: system-ui, sans-serif;
      }

      .zoo-header,
      .zoo-specimens {
        width: min(64rem, 100%);
        margin-inline: auto;
      }

      .zoo-header {
        margin-bottom: 2rem;
      }

      .zoo-header h1 {
        margin: 0 0 0.5rem;
      }

      .zoo-header p,
      .zoo-specimen h2 {
        margin: 0;
      }

      .zoo-specimens {
        display: grid;
        gap: 3rem;
      }

      .zoo-specimen {
        display: grid;
        gap: 0.75rem;
      }

      .zoo-specimen h2 {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .cedalion-panel {
        position: fixed;
        z-index: 100;
        inset: 0 0 0 auto;
        display: flex;
        width: 24rem;
        flex-direction: column;
        border-left: 2px solid #5f6dff;
        padding: 1rem;
        background: #f7f7fb;
        color: #181824;
        font:
          0.85rem/1.35 system-ui,
          sans-serif;
        text-align: left;
        text-transform: none;
        box-shadow: -0.4rem 0 1rem rgb(0 0 0 / 0.35);
      }

      .cedalion-panel h2,
      .cedalion-panel p {
        margin: 0;
      }

      .cedalion-panel-header {
        display: grid;
        gap: 0.5rem;
        flex: none;
      }

      .cedalion-state {
        width: 100%;
        min-height: 10rem;
        resize: vertical;
        box-sizing: border-box;
        font:
          0.72rem/1.25 ui-monospace,
          monospace;
      }

      .cedalion-controls {
        display: grid;
        gap: 1rem;
        overflow-y: auto;
        margin-top: 1rem;
        padding-right: 0.35rem;
      }

      .cedalion-supercategory,
      .cedalion-category,
      .cedalion-section {
        border: 1px solid #aeb0bd;
        background: #fff;
      }

      .cedalion-supercategory > summary,
      .cedalion-category > summary,
      .cedalion-section > summary {
        cursor: pointer;
        padding: 0.75rem;
        font-weight: 700;
      }

      .cedalion-supercategory-content,
      .cedalion-category-settings,
      .cedalion-section-settings {
        display: grid;
        gap: 0.75rem;
        padding: 0 0.75rem 0.75rem;
      }

      .cedalion-category {
        border: 1px solid #c8c8d2;
      }

      .cedalion-field {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 5rem auto;
        gap: 0.35rem;
        align-items: center;
      }

      .cedalion-field label {
        grid-column: 1 / -1;
        font-weight: 600;
      }

      .cedalion-field input[type='range'] {
        width: 100%;
      }

      .cedalion-field input[type='number'],
      .cedalion-field select,
      .cedalion-field button,
      .cedalion-reset-all {
        min-height: 2rem;
      }

      .cedalion-reset-all {
        border: 1px solid #8f1018;
        background: #c81e2b;
        color: #fff;
        font-weight: 700;
      }

      .cedalion-reset-all:hover {
        background: #a51420;
      }

      .cedalion-reset-all:focus-visible {
        outline: 3px solid #ff7a84;
        outline-offset: 2px;
      }

      .cedalion-field select {
        grid-column: 1 / 3;
      }

      .cedalion-field input[type='color'] {
        grid-column: 1 / 3;
        width: 100%;
      }

      .cedalion-field input[type='checkbox'] {
        grid-column: 1 / 3;
        justify-self: start;
        width: 1.25rem;
        height: 1.25rem;
      }
    </style>
  </head>
  <body class="zoo-page">
    <header class="zoo-header">
      <h1>XCC Character Sheet Zoo</h1>
      <p>
        Fixed Cedalion specimens covering Human, Noble, and every supported nonhuman race banner.
      </p>
    </header>

    <main id="app" class="zoo-specimens"></main>
    <script type="module" src="/src/generators/xcc/xcc_zoo.ts"></script>
  </body>
</html>
